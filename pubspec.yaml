name: flutter_quick_video_encoder
description: Encode raw RGB images to mp4 video using hardware h264 encoders. Also supports PCM audio & m4a files.
version: 1.7.2
homepage: https://github.com/chipweinberger/flutter_quick_video_encoder

# **Moves with the rest of the repo, because nothing is going back upstream.**
# `chipweinberger/flutter_quick_video_encoder` is not maintained, and this fork
# has diverged into a clip compositor and a preview decoder it never had — so
# there is no merge to stay compatible with, and a constraint kept low for the
# benefit of a merge that will not happen buys nothing and costs the language.
#
# This is now part of the repo-wide bump in .claude/rules/dart-style.md, which
# is the whole point of that rule: a split constraint set means a package
# silently compiles at an older language version, and the first symptom is a
# feature that works in one package and is a syntax error in its neighbor. That
# is precisely what happened here — `clipFrameAt` answers with a sealed
# `ClipFrameOutcome`, and at 2.15.1 the exhaustiveness check the type exists for
# was silently off in every consumer while the code still compiled.
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.lib.flutter_quick_video_encoder
        pluginClass: FlutterQuickVideoEncoderPlugin
      ios:
        pluginClass: FlutterQuickVideoEncoderPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterQuickVideoEncoderPlugin
        sharedDarwinSource: true

