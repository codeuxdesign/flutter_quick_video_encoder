group 'com.lib.flutter_quick_video_encoder'
version '1.0'

apply plugin: 'com.android.library'

android {
    // 34, not 33. Upstream's 33 makes this library unbuildable against a
    // current Flutter: androidx.fragment 1.7.1 and androidx.window 1.2.0 both
    // declare a minimum compileSdk of 34, so `checkDebugAarMetadata` fails
    // with fifteen errors before a single line of Java is compiled.
    //
    // compileSdk only chooses which APIs are visible at build time. minSdk
    // still says which devices can install this, and targetSdk still says
    // which runtime behaviors are opted into — neither moves here.
    compileSdkVersion 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:deprecation"
            options.compilerArgs << "-Xlint:unchecked"
        }
    }

    namespace 'com.lib.flutter_quick_video_encoder'
}

// The clip compositor's color conversion and its blend are deliberately free of
// android imports, so they run here on the host rather than only on a phone.
// That is the only part of the Android clip path a laptop can test at all, and
// it is the part that has historically been wrong — the source-over arithmetic
// was wrong for a day on Apple, and the HLG conversion has no Apple counterpart
// to compare against.
//
//   (cd app/android && ./gradlew :flutter_quick_video_encoder:testDebugUnitTest)
//
// The codec half needs a running Android, and there `ClipReader` is driven
// against a clip the test synthesizes rather than against a fixture, so the
// expected frame at every instant is known by construction:
//
//   (cd app/android && ./gradlew :flutter_quick_video_encoder:connectedDebugAndroidTest)
dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
}
